name: Production Smoke

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  verify-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for exact commit on Vercel production
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 36); do
            if curl -fsS https://memecoin-paper-terminal.vercel.app/api/version -o /tmp/paper-version.json; then
              current=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/paper-version.json'));process.stdout.write(String(j.commit||''))")
              echo "production commit=$current expected=$EXPECTED_COMMIT"
              if [ "$current" = "$EXPECTED_COMMIT" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          cat /tmp/paper-version.json 2>/dev/null || true
          exit 1

      - name: Run exact-commit production browser smoke
        env:
          PAPER_PRODUCTION_URL: https://memecoin-paper-terminal.vercel.app
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: npx playwright test --config=playwright.production.config.cjs
