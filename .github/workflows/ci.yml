name: CI
permissions:
  contents: read

concurrency:
  group: paper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject public secret names
        run: |
          if grep -RInE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PRIVATE|SERVICE_ROLE|TURNKEY_API_PRIVATE)' src .env.example; then
            echo "Server secret appears to use a NEXT_PUBLIC_ name."
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bpnhybmptjenrjntvmsz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Start production build
        run: |
          NEXT_PUBLIC_SUPABASE_URL=https://bpnhybmptjenrjntvmsz.supabase.co \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder \
          PAPER_INTEL_SUPABASE_URL=https://aehatnwbwyzpdsdqhkjv.supabase.co \
          npm start -- -p 3000 > /tmp/paper-next.log 2>&1 &
          echo $! > /tmp/paper-next.pid

      - name: Wait for PAPER server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/paper-home.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/paper-next.log
          exit 1

      - name: Verify PAPER launch homepage
        run: |
          grep -q "TRADE PAPER" /tmp/paper-home.html
          grep -q "EARN REAL" /tmp/paper-home.html
          grep -q "START TRADING" /tmp/paper-home.html

      - name: Verify live Solana market feed and CA lookup
        run: |
          ok=0
          for attempt in 1 2 3; do
            if curl -fsS http://127.0.0.1:3000/api/market/latest -o /tmp/paper-market.json; then
              if node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-market.json','utf8'))
          if(!Array.isArray(body.tokens) || body.tokens.length===0) throw new Error('live market feed returned zero tokens')
          const active=t=>t && t.mint && t.pairAddress && Number(t.priceUsd)>0 && Number(t.marketCap)>0 && (Number(t.buys5m||0)+Number(t.sells5m||0)>0)
          const first=body.tokens.find(active)||body.tokens.find(t=>t && t.mint && t.pairAddress && Number(t.priceUsd)>0 && Number(t.marketCap)>0)
          if(!first) throw new Error('live market feed has no usable priced token with market cap and a pool')
          fs.writeFileSync('/tmp/paper-mint.txt', String(first.mint))
          fs.writeFileSync('/tmp/paper-pool.txt', String(first.pairAddress))
          console.log(`market source=${body.source || 'unknown'} tokens=${body.tokens.length} sample=${first.symbol || first.mint}`)
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/paper-market.json 2>/dev/null || true; cat /tmp/paper-next.log; exit 1; fi
          mint=$(cat /tmp/paper-mint.txt)
          curl -fsS "http://127.0.0.1:3000/api/market/token/$mint" -o /tmp/paper-token.json
          node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-token.json','utf8'))
          if(!body.token || !body.token.mint || Number(body.token.priceUsd)<=0 || Number(body.token.marketCap)<=0) throw new Error('direct token lookup did not return usable price + market cap data')
          console.log(`Solana CA lookup ok mint=${body.token.mint} price=${body.token.priceUsd} mc=${body.token.marketCap}`)
          NODE

      - name: Verify Base and Ethereum live feeds
        run: |
          for chain in base ethereum; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fsS "http://127.0.0.1:3000/api/market/chain/$chain" -o "/tmp/$chain-market.json"; then
                if CHAIN="$chain" node - <<'NODE'
          const fs=require('fs')
          const chain=process.env.CHAIN
          const body=JSON.parse(fs.readFileSync(`/tmp/${chain}-market.json`,'utf8'))
          if(!Array.isArray(body.tokens)||body.tokens.length===0)throw new Error(`${chain} feed returned zero tokens`)
          const first=body.tokens.find(t=>t&&/^0x[a-fA-F0-9]{40}$/.test(String(t.mint||''))&&Number(t.priceUsd)>0)
          if(!first)throw new Error(`${chain} feed has no usable token`)
          fs.writeFileSync(`/tmp/${chain}-address.txt`,String(first.mint))
          console.log(`${chain} feed source=${body.source||'unknown'} tokens=${body.tokens.length} sample=${first.symbol||first.mint}`)
          NODE
                then ok=1; break; fi
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then cat "/tmp/$chain-market.json" 2>/dev/null || true; exit 1; fi
          done
          base_address=$(cat /tmp/base-address.txt)
          curl -fsS "http://127.0.0.1:3000/api/market/chain/base/token/$base_address" -o /tmp/base-token.json
          node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/base-token.json','utf8'))
          if(!body.token||Number(body.token.priceUsd)<=0)throw new Error('Base contract lookup failed')
          console.log(`Base contract lookup ok ${body.token.symbol||body.token.mint}`)
          NODE

      - name: Verify real OHLCV, one-second candles, and market tape
        run: |
          pool=$(cat /tmp/paper-pool.txt)
          chart_ok=0
          for attempt in 1 2 3; do
            if curl -fsS "http://127.0.0.1:3000/api/market/ohlcv/$pool?tf=1m" -o /tmp/paper-chart.json; then
              if node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-chart.json','utf8'))
          if(!Array.isArray(body.candles) || body.candles.length<2) throw new Error('OHLCV chart did not return enough real candles')
          const c=body.candles.at(-1)
          for(const k of ['time','open','high','low','close']) if(!Number.isFinite(Number(c[k]))) throw new Error(`invalid candle ${k}`)
          console.log(`OHLCV ok timeframe=${body.timeframe} candles=${body.candles.length}`)
          NODE
              then chart_ok=1; break; fi
            fi
            sleep 5
          done
          if [ "$chart_ok" -ne 1 ]; then cat /tmp/paper-chart.json 2>/dev/null || true; exit 1; fi

          seconds_ok=0
          for attempt in 1 2 3; do
            if curl -fsS "http://127.0.0.1:3000/api/market/ohlcv/$pool?tf=1s" -o /tmp/paper-1s.json; then
              if node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-1s.json','utf8'))
          if(body.timeframe!=='1s')throw new Error('one-second chart returned wrong timeframe')
          if(!Array.isArray(body.candles)||body.candles.length<1)throw new Error('one-second chart returned zero real trade candles')
          const c=body.candles.at(-1)
          for(const k of ['time','open','high','low','close'])if(!Number.isFinite(Number(c[k])))throw new Error(`invalid one-second candle ${k}`)
          console.log(`1s candles ok source=${body.source} candles=${body.candles.length}`)
          NODE
              then seconds_ok=1; break; fi
            fi
            sleep 4
          done
          if [ "$seconds_ok" -ne 1 ]; then cat /tmp/paper-1s.json 2>/dev/null || true; exit 1; fi

          curl -fsS "http://127.0.0.1:3000/api/market/trades/$pool" -o /tmp/paper-tape.json
          node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-tape.json','utf8'))
          if(!Array.isArray(body.trades)) throw new Error('market tape payload is invalid')
          console.log(`market tape ok trades=${body.trades.length}`)
          NODE

      - name: Verify live server indicators
        run: |
          pool=$(cat /tmp/paper-pool.txt)
          ok=0
          for attempt in 1 2 3; do
            if curl -fsS "http://127.0.0.1:3000/api/market/indicators/$pool?tf=1m" -o /tmp/paper-indicators.json; then
              if node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-indicators.json','utf8'))
          if(body.live!==true)throw new Error('indicator payload is not live')
          if(body.source!=='geckoterminal')throw new Error('unexpected indicator source')
          if(Number(body.candles)<30)throw new Error('not enough candles for indicators')
          for(const path of [['ema9'],['ema21'],['vwap']]){
            if(!Number.isFinite(Number(body.indicators?.[path[0]])))throw new Error(path[0]+' is invalid')
          }
          if(!Number.isFinite(Number(body.indicators?.rsi14)))throw new Error('RSI is invalid')
          if(!Number.isFinite(Number(body.indicators?.macd?.histogram)))throw new Error('MACD histogram is invalid')
          if(!Number.isFinite(Number(body.indicators?.bollinger20?.upper)))throw new Error('Bollinger upper is invalid')
          console.log('server indicators ok candles='+body.candles+' rsi='+body.indicators.rsi14)
          NODE
              then ok=1; break; fi
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/paper-indicators.json 2>/dev/null || true; exit 1; fi
          curl -fsS "http://127.0.0.1:3000/api/market/indicators/$pool?tf=1m" -o /tmp/paper-indicators-cached.json
          node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-indicators-cached.json','utf8'))
          if(body.cached!==true)throw new Error('second indicator request did not hit server cache')
          console.log('indicator cache ok')
          NODE

      - name: Verify shared PAPER execution model
        run: |
          node --experimental-strip-types --input-type=module - <<'NODE'
          const m=await import('./supabase/functions/_shared/paper-execution.ts')
          const buy=m.constantProductBuy(1,100000,1000)
          const sell=m.constantProductSell(1,100000,1000)
          if(!(buy.fillPrice>1&&buy.impactPct>0))throw new Error('buy model did not apply positive impact')
          if(!(sell.fillPrice<1&&sell.impactPct>0&&sell.grossFillUsd>0))throw new Error('sell model did not apply negative impact')
          const a=m.deterministicLatencyMs('same-key'),b=m.deterministicLatencyMs('same-key')
          if(a!==b||a<180||a>699)throw new Error('deterministic latency is invalid')
          console.log('execution model ok',buy,sell,{latency:a})
          NODE

      - name: Verify live holder intelligence
        run: |
          mint="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          ok=0
          for attempt in 1 2 3; do
            if curl -fsS "http://127.0.0.1:3000/api/intelligence/token/$mint" -o /tmp/paper-token-intel.json; then
              if MINT="$mint" node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-token-intel.json','utf8'))
          if(body.live!==true)throw new Error('token intelligence is not live')
          if(!Array.isArray(body.distribution?.holders)||body.distribution.holders.length===0)throw new Error('holder map returned zero accounts')
          if(!Array.isArray(body.source)||!body.source.includes('solana-mainnet-rpc'))throw new Error('holder intelligence did not use live Solana RPC')
          if(body.token?.mint!==process.env.MINT)throw new Error('token intelligence mint mismatch')
          if(!Number.isFinite(Number(body.distribution.top10Pct)))throw new Error('top10 holder concentration invalid')
          console.log('holder intelligence ok mint='+process.env.MINT+' holders='+body.distribution.holders.length+' top10='+body.distribution.top10Pct)
          NODE
              then ok=1; break; fi
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/paper-token-intel.json 2>/dev/null || true; exit 1; fi

      - name: Verify live smart-wallet scoring
        run: |
          wallet=""
          node - <<'NODE'
          const fs=require('fs')
          const market=JSON.parse(fs.readFileSync('/tmp/paper-market.json','utf8'))
          fs.writeFileSync('/tmp/paper-pools.txt',(market.tokens||[]).map(t=>t.pairAddress).filter(Boolean).slice(0,10).join('\n'))
          NODE
          while IFS= read -r pool; do
            [ -z "$pool" ] && continue
            if curl -fsS "http://127.0.0.1:3000/api/market/trades/$pool" -o /tmp/paper-wallet-tape.json; then
              wallet=$(node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-wallet-tape.json','utf8'))
          const row=(body.trades||[]).find(t=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(String(t.trader||'')))
          process.stdout.write(row?.trader||'')
          NODE
              )
              [ -n "$wallet" ] && break
            fi
          done < /tmp/paper-pools.txt
          if [ -z "$wallet" ]; then echo "No live trader address found across sampled pools"; exit 1; fi
          ok=0
          for attempt in 1 2 3; do
            if curl -fsS "http://127.0.0.1:3000/api/intelligence/wallet/$wallet" -o /tmp/paper-wallet-intel.json; then
              if node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-wallet-intel.json','utf8'))
          if(body.live!==true)throw new Error('wallet intelligence is not live')
          const score=Number(body.score?.value)
          if(!Number.isFinite(score)||score<0||score>100)throw new Error('wallet score invalid')
          if(body.profitability?.available!==false)throw new Error('profitability should not be invented')
          if(!Array.isArray(body.source)||!body.source.some(x=>['helius','helius-rpc','helius_enhanced_transactions','solana_publicnode','solana_public_rpc','solana-mainnet-rpc','quicknode-demo'].includes(String(x))))throw new Error('wallet score did not use a live Solana source')
          console.log('wallet intelligence ok score='+score+' confidence='+body.score?.confidence)
          NODE
              then ok=1; break; fi
            fi
            sleep 4
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/paper-wallet-intel.json 2>/dev/null || true; exit 1; fi
          curl -fsS "http://127.0.0.1:3000/api/intelligence/smart-wallets" -o /tmp/paper-smart-wallets.json
          node - <<'NODE'
          const fs=require('fs')
          const body=JSON.parse(fs.readFileSync('/tmp/paper-smart-wallets.json','utf8'))
          if(body.live!==true||!Array.isArray(body.wallets))throw new Error('smart-wallet leaderboard payload invalid')
          console.log('smart-wallet feed ok wallets='+body.wallets.length)
          NODE

      - name: Verify public PAPER routes and brand assets
        run: |
          for route in / /discover /spot /pulse /portfolio /chains /wallets /watchlist /scanner /smart-money /heatmap /compare /workspaces /journal /replay /community /status /rewards /leaderboards /profile /coin /legal /opengraph-image /twitter-image /icon.svg /robots.txt /sitemap.xml /manifest.webmanifest; do
            curl -fsS "http://127.0.0.1:3000$route" >/dev/null
          done

      - name: Verify PAPER PWA shell
        run: |
          curl -fsS http://127.0.0.1:3000/sw.js -o /tmp/paper-sw.js
          grep -q "paper-shell-v10-1" /tmp/paper-sw.js
          grep -q "url.pathname.startsWith('/api/')" /tmp/paper-sw.js
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest -o /tmp/paper-manifest.json
          node - <<'NODE'
          const fs=require('fs')
          const m=JSON.parse(fs.readFileSync('/tmp/paper-manifest.json','utf8'))
          if(m.display!=='standalone'||m.scope!=='/'||!Array.isArray(m.shortcuts)||m.shortcuts.length<3)throw new Error('PWA manifest incomplete')
          console.log('PWA shell ok shortcuts='+m.shortcuts.length)
          NODE

      - name: Run Chromium terminal E2E
        run: npx playwright test

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/paper-next.log || true

      - name: Stop PAPER server
        if: always()
        run: |
          if [ -f /tmp/paper-next.pid ]; then
            kill "$(cat /tmp/paper-next.pid)" 2>/dev/null || true
          fi
